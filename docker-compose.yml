services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dispute_agent
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dispute_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - postgres
          - db

  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      payswift:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./ops-ui:/app/ops-ui
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/dispute_agent
      - PAYSWIFT_BASE_URL=http://payswift:8081
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_ORDER=${LLM_ORDER:-groq:openai/gpt-oss-120b,groq:openai/gpt-oss-20b,gemini:gemini-2.5-flash}
      - ALLOW_RESET=${ALLOW_RESET:-1}

volumes:
  postgres_data:
